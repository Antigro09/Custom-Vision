name: Correctness audit
on:
  push:
    branches: [vision/performance-correctness-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive exactly the tested source
        run: git archive --format=tar --output="$RUNNER_TEMP/source.tar" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 7
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: mkdir -p .audit-results
      - run: python -m pip install -e '.[desktop,test]' pytest-cov ruff pybind11==2.13.6
      - run: sudo apt-get update && sudo apt-get install -y cmake libopencv-dev
      - run: VISION_PYTHON=$(which python) ./scripts/build_native.sh -DCUSTOM_VISION_CUDA_PREPROCESS=OFF -DCUSTOM_VISION_CUDA_APRILTAGS=OFF
      - name: Compile Python and validate shell syntax
        run: |
          python -m compileall -q custom_vision scripts tests
          find scripts -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Test suite with coverage and slow-test report
        run: |
          set -o pipefail
          python -m pytest -q -ra --durations=20 --junitxml=.audit-results/junit.xml --cov=custom_vision --cov-report=term-missing --cov-report=json:.audit-results/coverage.json 2>&1 | tee .audit-results/pytest.log
      - name: Smoke tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python scripts/smoke_test.py 2>&1 | tee .audit-results/smoke-apriltags.log
          python scripts/smoke_objects.py 2>&1 | tee .audit-results/smoke-objects.log
      - name: Focused Python error scan
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ruff check --select E9,F821,F822,F823,F831 custom_vision scripts tests 2>&1 | tee .audit-results/static-check.log
      - name: Record environment
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD > .audit-results/commit.txt
          python -m pip freeze > .audit-results/dependencies.txt
          uname -a > .audit-results/platform.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: audit-results
          path: .audit-results/
          include-hidden-files: true
          retention-days: 7
