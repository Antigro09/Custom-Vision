name: Calibration
on:
  push:
    branches: [vision/guided-mrcal-calibration]
  pull_request:
    paths: ['calibration.py', 'custom_vision/calibration_*.py', 'scripts/mrcal_*', 'scripts/install_calibration.sh', 'tests/test_guided_calibration.py', '.github/workflows/calibration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mrcal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install distro calibration packages without GPU libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mrcal python3-mrcal mrgingham python3-opencv python3-pytest python3-scipy python3-yaml xvfb
      - name: Record the real mrcal API and environment
        run: |
          mkdir -p calibration-results
          /usr/bin/python3 -c 'import mrcal, cv2, numpy, inspect; print(mrcal.__version__, cv2.__version__, numpy.__version__); print(inspect.signature(mrcal.projection_uncertainty)); print(inspect.signature(mrcal.projection_diff)); print(inspect.signature(mrcal.ref_calibration_object))' | tee calibration-results/environment.txt
          mrcal-calibrate-cameras --help > calibration-results/solver-help.txt
          mrgingham --help > calibration-results/corner-help.txt
      - name: Calibration regressions and actual solver integration
        run: |
          if test -f tests/test_guided_calibration.py; then
            xvfb-run -a /usr/bin/python3 -m pytest -q tests/test_guided_calibration.py --junitxml=calibration-results/tests.xml
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: calibration-${{ matrix.os }}
          path: calibration-results/
          retention-days: 14
