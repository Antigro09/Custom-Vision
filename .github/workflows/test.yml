name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[desktop,test]'
      - run: sudo apt-get update && sudo apt-get install -y cmake libopencv-dev
      - run: python -m pip install pybind11==2.13.6
      - run: VISION_PYTHON=$(which python) ./scripts/build_native.sh -DCUSTOM_VISION_CUDA_PREPROCESS=OFF -DCUSTOM_VISION_CUDA_APRILTAGS=OFF
      - run: python -m pytest -q
      - run: python scripts/smoke_test.py
